    get:
      description: Получить статистику по задачам с опциональной фильтрацией
      parameters:
      - description: Фильтр по ID автора
        in: query
        name: user_id
        type: integer
      - description: Начало периода (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Конец периода (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mishalyamets1_golang_todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":

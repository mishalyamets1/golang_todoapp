services:

  todoapp:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=${HTTP_ADDR}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_HOST=todo_app-postgres
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "8080:8080"
    restart: always

  todo_app-postgres:
    image: postgres:18.1-bookworm
    container_name: go_todo-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  todo-app-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: todo_app-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todo_app-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
  swagger:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM  golang:1.26.5-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@latest
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes: 
      - ${PROJECT_ROOT}:/code
      
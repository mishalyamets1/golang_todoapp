<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App — Golang TODO API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0f14;
            --surface: #141a24;
            --surface-2: #1c2433;
            --border: #2a3548;
            --text: #e8edf5;
            --muted: #8b9bb4;
            --accent: #3dd6c3;
            --accent-dim: #2a9d8f;
            --danger: #ff6b6b;
            --warning: #ffd166;
            --success: #06d6a0;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(61, 214, 195, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 90% 100%, rgba(42, 157, 143, 0.08), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(61, 214, 195, 0.3);
        }

        .logo h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo p {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .api-badge {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            background: rgba(61, 214, 195, 0.1);
            border: 1px solid rgba(61, 214, 195, 0.25);
            padding: 6px 12px;
            border-radius: 999px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: fit-content;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--text); background: var(--surface-2); }
        .tab.active {
            background: var(--accent);
            color: var(--bg);
            font-weight: 600;
        }

        .panel { display: none; animation: fadeIn 0.25s ease; }
        .panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 span { color: var(--muted); font-weight: 400; font-size: 0.85rem; }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 72px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-primary:hover:not(:disabled) { background: #4ee8d5; transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }

        .btn-danger {
            background: rgba(255, 107, 107, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.25); }

        .btn-sm { padding: 6px 10px; font-size: 0.8rem; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

        .list { display: flex; flex-direction: column; gap: 10px; }

        .list-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .list-item:hover { border-color: rgba(61, 214, 195, 0.3); }

        .list-item.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(61, 214, 195, 0.2);
        }

        .item-main { flex: 1; min-width: 0; }

        .item-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .item-meta {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge-done { background: rgba(6, 214, 160, 0.15); color: var(--success); }
        .badge-open { background: rgba(255, 209, 102, 0.15); color: var(--warning); }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-icon { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.5; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: flex-end;
        }

        .filters .form-group { margin-bottom: 0; flex: 1; min-width: 100px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.88rem;
            max-width: 360px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
            border: 1px solid var(--border);
        }

        .toast-error { background: #2a1518; border-color: rgba(255, 107, 107, 0.4); color: #ffb4b4; }
        .toast-success { background: #122820; border-color: rgba(6, 214, 160, 0.4); color: #8ff0d0; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.2s ease;
        }

        .modal h3 { margin-bottom: 16px; font-size: 1.1rem; }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; color: var(--text); }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">
                <div class="logo-icon">✓</div>
                <div>
                    <h1>Todo App</h1>
                    <p>Golang TODO API v1.0</p>
                </div>
            </div>
            <div class="api-badge" id="api-status">API: localhost:8080</div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="users">Пользователи</button>
            <button class="tab" data-tab="tasks">Задачи</button>
            <button class="tab" data-tab="statistics">Статистика</button>
        </nav>

        <!-- USERS -->
        <section class="panel active" id="panel-users">
            <div class="grid-2">
                <div class="card">
                    <h2>Новый пользователь <span>POST /users</span></h2>
                    <form id="form-create-user">
                        <div class="form-group">
                            <label for="user-fullname">Полное имя *</label>
                            <input id="user-fullname" required minlength="3" maxlength="100" placeholder="Иван Иванов">
                        </div>
                        <div class="form-group">
                            <label for="user-phone">Телефон</label>
                            <input id="user-phone" maxlength="15" placeholder="+79885530945">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%">Создать</button>
                    </form>
                </div>
                <div class="card">
                    <div class="toolbar">
                        <h2 style="margin:0">Список <span>GET /users</span></h2>
                        <button class="btn btn-ghost btn-sm" onclick="loadUsers()">↻ Обновить</button>
                    </div>
                    <div class="filters">
                        <div class="form-group">
                            <label>limit</label>
                            <input type="number" id="users-limit" min="1" placeholder="10">
                        </div>
                        <div class="form-group">
                            <label>offset</label>
                            <input type="number" id="users-offset" min="0" placeholder="0">
                        </div>
                    </div>
                    <div class="list" id="users-list">
                        <div class="empty"><div class="empty-icon">👤</div>Загрузка...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- TASKS -->
        <section class="panel" id="panel-tasks">
            <div class="grid-2">
                <div class="card">
                    <h2>Новая задача <span>POST /tasks</span></h2>
                    <form id="form-create-task">
                        <div class="form-group">
                            <label for="task-title">Заголовок *</label>
                            <input id="task-title" required minlength="1" maxlength="100" placeholder="Купить молоко">
                        </div>
                        <div class="form-group">
                            <label for="task-desc">Описание</label>
                            <textarea id="task-desc" maxlength="1000" placeholder="Необязательно"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="task-author">ID автора *</label>
                            <input type="number" id="task-author" required min="1" placeholder="1">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%">Создать задачу</button>
                    </form>
                </div>
                <div class="card">
                    <div class="toolbar">
                        <h2 style="margin:0">Задачи <span>GET /tasks</span></h2>
                        <button class="btn btn-ghost btn-sm" onclick="loadTasks()">↻ Обновить</button>
                    </div>
                    <div class="filters">
                        <div class="form-group">
                            <label>user_id</label>
                            <input type="number" id="tasks-user-id" min="1" placeholder="все">
                        </div>
                        <div class="form-group">
                            <label>limit</label>
                            <input type="number" id="tasks-limit" min="1" placeholder="20">
                        </div>
                        <div class="form-group">
                            <label>offset</label>
                            <input type="number" id="tasks-offset" min="0" placeholder="0">
                        </div>
                    </div>
                    <div class="list" id="tasks-list">
                        <div class="empty"><div class="empty-icon">📋</div>Загрузка...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- STATISTICS -->
        <section class="panel" id="panel-statistics">
            <div class="card">
                <h2>Статистика <span>GET /statistics</span></h2>
                <div class="filters">
                    <div class="form-group">
                        <label>user_id</label>
                        <input type="number" id="stats-user-id" min="1" placeholder="все пользователи">
                    </div>
                    <div class="form-group">
                        <label>from (YYYY-MM-DD)</label>
                        <input type="date" id="stats-from">
                    </div>
                    <div class="form-group">
                        <label>to (YYYY-MM-DD)</label>
                        <input type="date" id="stats-to">
                    </div>
                    <button class="btn btn-primary" onclick="loadStatistics()">Получить</button>
                </div>
                <div id="stats-result">
                    <div class="empty"><div class="empty-icon">📊</div>Нажмите «Получить» для загрузки статистики</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Edit modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Редактирование</h3>
            <form id="modal-form"></form>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal()">Отмена</button>
                <button type="button" class="btn btn-primary" id="modal-save">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script>
        // Swagger: host=localhost:8080, basePath=/api/v1
        const API_BASE = 'http://localhost:8080/api/v1';

        // --- API client (paths from swagger.yaml) ---

        async function api(method, path, body, query) {
            const url = new URL(API_BASE + path);
            if (query) {
                for (const [k, v] of Object.entries(query)) {
                    if (v !== null && v !== undefined && v !== '') {
                        url.searchParams.set(k, v);
                    }
                }
            }
            const opts = { method, headers: {} };
            if (body !== undefined) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(url, opts);
            if (res.status === 204) return null;
            let data = null;
            const text = await res.text();
            if (text) {
                try { data = JSON.parse(text); } catch { data = { message: text }; }
            }
            if (!res.ok) {
                const msg = data?.message || data?.error || `HTTP ${res.status}`;
                throw new Error(msg);
            }
            return data;
        }

        const UsersAPI = {
            list: (q) => api('GET', '/users', undefined, q),
            get: (id) => api('GET', `/users/${id}`),
            create: (body) => api('POST', '/users', body),
            patch: (id, body) => api('PATCH', `/users/${id}`, body),
            delete: (id) => api('DELETE', `/users/${id}`),
        };

        const TasksAPI = {
            list: (q) => api('GET', '/tasks', undefined, q),
            get: (id) => api('GET', `/tasks/${id}`),
            create: (body) => api('POST', '/tasks', body),
            patch: (id, body) => api('PATCH', `/tasks/${id}`, body),
            delete: (id) => api('DELETE', `/tasks/${id}`),
        };

        const StatisticsAPI = {
            get: (q) => api('GET', '/statistics', undefined, q),
        };

        // --- UI helpers ---

        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        function toast(msg, type = 'error') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.getElementById('toasts').appendChild(el);
            setTimeout(() => el.remove(), 4500);
        }

        function fmtDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit',
            });
        }

        function queryVal(id) {
            const v = document.getElementById(id).value.trim();
            return v === '' ? undefined : v;
        }

        // --- Tabs ---

        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'statistics') loadStatistics();
            });
        });

        // --- Users ---

        async function loadUsers() {
            const list = document.getElementById('users-list');
            list.innerHTML = '<div class="empty"><span class="loading"></span></div>';
            try {
                const users = await UsersAPI.list({
                    limit: queryVal('users-limit'),
                    offset: queryVal('users-offset'),
                });
                if (!users.length) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">👤</div>Пользователей нет</div>';
                    return;
                }
                list.innerHTML = users.map(u => `
                    <div class="list-item" data-id="${u.id}">
                        <div class="item-main">
                            <div class="item-title">${esc(u.full_name)}</div>
                            <div class="item-meta">
                                id: ${u.id} · v${u.version}
                                ${u.phone_number ? ' · ' + esc(u.phone_number) : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-ghost btn-sm btn-edit-user" data-id="${u.id}">✎</button>
                            <button class="btn btn-danger btn-sm btn-delete-user" data-id="${u.id}">✕</button>
                        </div>
                    </div>
                `).join('');
                users.forEach(u => { usersCache[u.id] = u; });
            } catch (e) {
                list.innerHTML = '<div class="empty">Ошибка загрузки</div>';
                toast(e.message);
            }
        }

        document.getElementById('form-create-user').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('user-fullname').value.trim();
            const phone = document.getElementById('user-phone').value.trim();
            const body = { full_name };
            if (phone) body.phone_number = phone;
            try {
                await UsersAPI.create(body);
                toast('Пользователь создан', 'success');
                e.target.reset();
                loadUsers();
            } catch (err) { toast(err.message); }
        });

        const usersCache = {};
        const tasksCache = {};

        async function deleteUser(id) {
            if (!confirm(`Удалить пользователя #${id}?`)) return;
            try {
                await UsersAPI.delete(id);
                toast('Пользователь удалён', 'success');
                loadUsers();
            } catch (err) { toast(err.message); }
        }

        function editUser(id) {
            const u = usersCache[id];
            if (!u) return;
            openModal('Редактировать пользователя #' + id, `
                <div class="form-group">
                    <label>Полное имя</label>
                    <input id="edit-user-name" value="${esc(u.full_name)}" minlength="3" maxlength="100">
                </div>
                <div class="form-group">
                    <label>Телефон (пусто = удалить)</label>
                    <input id="edit-user-phone" value="${esc(u.phone_number || '')}" maxlength="15" placeholder="+7...">
                </div>
            `, async () => {
                const name = document.getElementById('edit-user-name').value.trim();
                const phoneVal = document.getElementById('edit-user-phone').value.trim();
                const body = {};
                if (name) body.full_name = name;
                if (phoneVal) body.phone_number = phoneVal;
                else body.phone_number = null;
                await UsersAPI.patch(id, body);
                toast('Пользователь обновлён', 'success');
                loadUsers();
            });
        }

        // --- Tasks ---

        async function loadTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '<div class="empty"><span class="loading"></span></div>';
            try {
                const tasks = await TasksAPI.list({
                    user_id: queryVal('tasks-user-id'),
                    limit: queryVal('tasks-limit'),
                    offset: queryVal('tasks-offset'),
                });
                if (!tasks.length) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>Задач нет</div>';
                    return;
                }
                list.innerHTML = tasks.map(t => `
                    <div class="list-item">
                        <div class="item-main">
                            <div class="item-title">
                                ${esc(t.title)}
                                <span class="badge ${t.completed ? 'badge-done' : 'badge-open'}">${t.completed ? 'выполнена' : 'открыта'}</span>
                            </div>
                            <div class="item-meta">
                                id: ${t.id} · автор: ${t.author_user_id} · v${t.version}
                                ${t.description ? '<br>' + esc(t.description) : ''}
                                <br>создана: ${fmtDate(t.created_at)}
                                ${t.completed_at ? ' · завершена: ' + fmtDate(t.completed_at) : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-ghost btn-sm btn-toggle-task" data-id="${t.id}" data-completed="${t.completed}">${t.completed ? '↩' : '✓'}</button>
                            <button class="btn btn-ghost btn-sm btn-edit-task" data-id="${t.id}">✎</button>
                            <button class="btn btn-danger btn-sm btn-delete-task" data-id="${t.id}">✕</button>
                        </div>
                    </div>
                `).join('');
                tasks.forEach(t => { tasksCache[t.id] = t; });
            } catch (e) {
                list.innerHTML = '<div class="empty">Ошибка загрузки</div>';
                toast(e.message);
            }
        }

        document.getElementById('form-create-task').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                title: document.getElementById('task-title').value.trim(),
                author_user_id: parseInt(document.getElementById('task-author').value, 10),
            };
            const desc = document.getElementById('task-desc').value.trim();
            if (desc) body.description = desc;
            try {
                await TasksAPI.create(body);
                toast('Задача создана', 'success');
                e.target.reset();
                loadTasks();
            } catch (err) { toast(err.message); }
        });

        async function toggleTask(id, completed) {
            try {
                await TasksAPI.patch(id, { completed });
                toast(completed ? 'Задача выполнена' : 'Задача снова открыта', 'success');
                loadTasks();
            } catch (err) { toast(err.message); }
        }

        async function deleteTask(id) {
            if (!confirm(`Удалить задачу #${id}?`)) return;
            try {
                await TasksAPI.delete(id);
                toast('Задача удалена', 'success');
                loadTasks();
            } catch (err) { toast(err.message); }
        }

        function editTask(id) {
            const t = tasksCache[id];
            if (!t) return;
            openModal('Редактировать задачу #' + id, `
                <div class="form-group">
                    <label>Заголовок</label>
                    <input id="edit-task-title" value="${esc(t.title)}" maxlength="100">
                </div>
                <div class="form-group">
                    <label>Описание (пусто = удалить)</label>
                    <textarea id="edit-task-desc" maxlength="1000">${esc(t.description || '')}</textarea>
                </div>
            `, async () => {
                const newTitle = document.getElementById('edit-task-title').value.trim();
                const newDesc = document.getElementById('edit-task-desc').value.trim();
                const body = {};
                if (newTitle) body.title = newTitle;
                body.description = newDesc || null;
                await TasksAPI.patch(id, body);
                toast('Задача обновлена', 'success');
                loadTasks();
            });
        }

        // --- Statistics ---

        async function loadStatistics() {
            const el = document.getElementById('stats-result');
            el.innerHTML = '<div class="empty"><span class="loading"></span></div>';
            try {
                const stats = await StatisticsAPI.get({
                    user_id: queryVal('stats-user-id'),
                    from: queryVal('stats-from'),
                    to: queryVal('stats-to'),
                });
                const rate = stats.tasks_completed_rate != null
                    ? stats.tasks_completed_rate.toFixed(1) + '%'
                    : '—';
                const avg = stats.tasks_average_competion_time || '—';
                el.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${stats.tasks_created}</div>
                            <div class="stat-label">Создано задач</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.tasks_completed}</div>
                            <div class="stat-label">Выполнено</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${rate}</div>
                            <div class="stat-label">Процент выполнения</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" style="font-size:1.1rem">${esc(avg)}</div>
                            <div class="stat-label">Среднее время выполнения</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                el.innerHTML = '<div class="empty">Ошибка загрузки статистики</div>';
                toast(e.message);
            }
        }

        // --- Modal ---

        let modalSaveFn = null;

        function openModal(title, formHtml, onSave) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-form').innerHTML = formHtml;
            modalSaveFn = onSave;
            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
            modalSaveFn = null;
        }

        document.getElementById('modal-save').addEventListener('click', async () => {
            if (!modalSaveFn) return;
            try {
                await modalSaveFn();
                closeModal();
            } catch (err) { toast(err.message); }
        });

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        // --- Event delegation ---

        document.getElementById('users-list').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const id = parseInt(btn.dataset.id, 10);
            if (btn.classList.contains('btn-edit-user')) editUser(id);
            if (btn.classList.contains('btn-delete-user')) deleteUser(id);
        });

        document.getElementById('tasks-list').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const id = parseInt(btn.dataset.id, 10);
            if (btn.classList.contains('btn-edit-task')) editTask(id);
            if (btn.classList.contains('btn-delete-task')) deleteTask(id);
            if (btn.classList.contains('btn-toggle-task')) {
                toggleTask(id, btn.dataset.completed !== 'true');
            }
        });

        // --- Init ---

        loadUsers();
        loadTasks();
    </script>
</body>
</html>
